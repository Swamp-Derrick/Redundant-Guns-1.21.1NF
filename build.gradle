plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = '0.1.1'
group = 'zaeonninezero.redundantguns'
base { archivesName = 'RedundantGuns-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
repositories {
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}
neoForge {
    version = '21.1.228'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'redundantguns'
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            systemProperty 'redundantguns.clientSmoke', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'RedundantGuns-SmokeWorld'
            systemProperty 'redundantguns.smokeWorld', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        redundantguns {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}
dependencies {
    implementation files('libs/cgm-1.4.4.jar')
    implementation files(providers.gradleProperty('nzgeJar').getOrElse('libs/NZGE-Unofficial-0.1.1.jar'))
    implementation 'curse.maven:framework-549225:7530361'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    from('LICENSE')
    manifest.attributes('Implementation-Version': project.version)
}
tasks.named('runClientSmoke') {
    doFirst {
        file('artifacts').mkdirs()
        delete layout.projectDirectory.file('artifacts/client-smoke-result.txt')
    }
    doLast {
        def result = file('artifacts/client-smoke-result.txt')
        if (!result.exists() || !result.text.startsWith('PASS:')) {
            throw new GradleException('Client smoke test failed; see artifacts/client-smoke.log')
        }
    }
}
